<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agent-mini · day3</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
         margin: 0; height: 100vh; color: #222; background: #fff; }
  #app { display: grid; grid-template-columns: 220px 1fr;
         height: 100vh; }
  #side { border-right: 1px solid #ddd; background: #fafafa;
          display: flex; flex-direction: column; }
  #side h1 { font-size: 0.95rem; margin: 0; padding: 0.75rem 1rem;
             border-bottom: 1px solid #ddd; }
  #new { margin: 0.5rem; padding: 0.4rem; font: inherit;
         cursor: pointer; border: 1px solid #ccc; background: #fff;
         border-radius: 4px; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto;
          flex: 1; }
  #list li { display: flex; align-items: center; padding: 0.4rem 0.6rem;
             cursor: pointer; border-bottom: 1px solid #eee;
             gap: 0.4rem; }
  #list li:hover { background: #f0f0f0; }
  #list li.active { background: #e8efff; }
  #list li .label { flex: 1; overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; }
  #list li .del { background: none; border: none; color: #c30;
                  cursor: pointer; font-size: 1rem; padding: 0 0.2rem; }
  main { display: flex; flex-direction: column; min-width: 0; }
  #header { padding: 0.6rem 1rem; border-bottom: 1px solid #ddd;
            font-size: 0.85rem; color: #555; }
  #log { flex: 1; padding: 0.75rem 1rem; overflow-y: auto; }
  #log div { margin: 0.15rem 0; white-space: pre-wrap;
             word-break: break-word; }
  #log div[data-role="user"]  { color: #06c; }
  #log div[data-role="tool"]   { color: #888; }
  #log div[data-role="error"]  { color: #c30; }
  form { display: flex; gap: 0.5rem; padding: 0.5rem 1rem;
         border-top: 1px solid #ddd; }
  input { flex: 1; padding: 0.45rem 0.6rem; font: inherit;
          border: 1px solid #ccc; border-radius: 4px; }
  input:disabled { background: #f4f4f4; color: #888; }
  button { padding: 0.45rem 1rem; font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; color: #888; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>agent-mini <small>day3</small></h1>
    <button id="new">+ New session</button>
    <ul id="list"></ul>
  </aside>
  <main>
    <div id="header">No session selected</div>
    <div id="log"></div>
    <form id="f">
      <input id="t" autocomplete="off" placeholder="Say something…" disabled>
      <button disabled>Send</button>
    </form>
  </main>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const list = $("list"), log = $("log"), t = $("t"), btn = $("f").querySelector("button");
  const header = $("header"), newBtn = $("new");

  // sessionId is the session currently being viewed; localStorage remembers it so refresh doesn't lose it
  let currentId = localStorage.getItem("currentId") || null;
  let es = null;     // current EventSource

  function shortId(id) { return id.slice(0, 8); }
  function setHeader() {
    header.textContent = currentId ? "session " + shortId(currentId) : "No session selected";
    t.disabled = !currentId;
    btn.disabled = !currentId;
  }

  function clearLog() { log.innerHTML = ""; }

  function append(role, text) {
    const div = document.createElement("div");
    div.dataset.role = role;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }
  function appendDelta(delta) {
    const last = log.lastElementChild;
    if (last && last.dataset.role === "assistant") {
      last.textContent += delta;
    } else {
      append("assistant", delta);
    }
    log.scrollTop = log.scrollHeight;
  }

  function renderList(sessions) {
    list.innerHTML = "";
    for (const s of sessions) {
      const li = document.createElement("li");
      if (s.id === currentId) li.classList.add("active");
      li.dataset.id = s.id;
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = "session " + shortId(s.id);
      li.appendChild(label);
      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "Delete";
      li.appendChild(del);
      list.appendChild(li);
    }
    setHeader();
  }

  async function refreshList() {
    const r = await fetch("/api/sessions");
    const j = await r.json();
    renderList(j.sessions);
  }

  function closeStream() {
    if (es) { es.close(); es = null; }
  }
  function openStream(id) {
    closeStream();
    clearLog();
    if (!id) return;
    es = new EventSource("/api/events?session=" + encodeURIComponent(id));
    es.addEventListener("text_delta", (ev) => appendDelta(JSON.parse(ev.data).delta));
    es.addEventListener("tool_start", (ev) => append("tool", "[tool] " + JSON.parse(ev.data).toolName));
    es.addEventListener("agent_end", () => { t.disabled = false; t.focus(); });
    es.onerror = () => { /* browser auto-reconnects */ };
  }

  function switchTo(id) {
    currentId = id;
    localStorage.setItem("currentId", id || "");
    // Highlight the current row
    for (const li of list.children) li.classList.toggle("active", li.dataset.id === id);
    setHeader();
    openStream(id);
  }

  // ---- Event bindings ----
  newBtn.addEventListener("click", async () => {
    const r = await fetch("/api/sessions", { method: "POST" });
    const j = await r.json();
    await refreshList();
    switchTo(j.id);
  });

  list.addEventListener("click", async (e) => {
    const del = e.target.closest(".del");
    const li = e.target.closest("li");
    if (!li) return;
    const id = li.dataset.id;
    if (del) {
      e.stopPropagation();
      await fetch("/api/sessions/" + encodeURIComponent(id), { method: "DELETE" });
      if (id === currentId) {
        const next = [...list.children].map(x => x.dataset.id).find(x => x !== id) || null;
        switchTo(next);
      }
      await refreshList();
      return;
    }
    if (id !== currentId) switchTo(id);
  });

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = t.value.trim();
    if (!text || !currentId) return;
    t.value = "";
    t.disabled = true;
    append("user", "you> " + text);
    const r = await fetch("/api/prompt", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ sessionId: currentId, text }),
    });
    if (!r.ok) {
      const msg = r.status === 409 ? "agent is busy" : (await r.text());
      append("error", "[error] " + r.status + " " + msg);
      t.disabled = false;
      t.focus();
    }
  });

  // Startup: pull the list once, and if currentId still exists, open its stream
  (async () => {
    await refreshList();
    if (currentId && [...list.children].some(li => li.dataset.id === currentId)) {
      switchTo(currentId);
    } else {
      currentId = null;
      localStorage.removeItem("currentId");
      setHeader();
    }
  })();
</script>
</body>
</html>
